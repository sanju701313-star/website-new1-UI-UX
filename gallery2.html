<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lumin Consultancy Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700&family=Playfair+Display:ital,wght@0,400;1,700&display=swap');

        body { 
            margin: 0; 
            overflow: hidden; 
            background: #ffffff;
            color: #0f172a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            touch-action: none;
        }

        .serif { font-family: 'Playfair Display', serif; }

        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
            transition: opacity 0.4s ease;
        }

        #ui-layer * { pointer-events: auto; }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(15, 23, 42, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #focus-ui {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #focus-ui.visible {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .exit-btn {
            background: #2563eb;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
            transition: transform 0.2s ease;
        }

        .exit-btn:hover {
            transform: scale(1.05);
            background: #1d4ed8;
        }

        .counter-badge {
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.2);
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            color: #2563eb;
            text-transform: uppercase;
        }

        @media (max-width: 640px) {
            .header-title { font-size: 1.25rem !important; }
        }
    </style>
</head>
<body>

    <div id="loader" class="loading-screen">
        <h1 class="serif text-4xl italic mb-4 text-slate-900">Lumin Gallery</h1>
        <div class="w-32 h-1 bg-slate-100 rounded-full overflow-hidden">
            <div id="progress" class="h-full bg-blue-600 w-0 transition-all duration-300"></div>
        </div>
    </div>

    <div id="focus-ui">
        <button onclick="exitFocusMode()" class="exit-btn pointer-events-auto">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            Back to Gallery
        </button>
    </div>

    <div id="ui-layer">
        <header class="flex justify-between items-start">
            <div class="flex items-start gap-4">
                <!-- Return Home Button -->
                <a href="index.html" class="glass p-3 rounded-full text-slate-600 hover:text-blue-600 transition-all flex items-center justify-center group">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:-translate-x-1 transition-transform">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span class="max-w-0 overflow-hidden group-hover:max-w-xs group-hover:ml-2 transition-all duration-300 text-[10px] font-bold uppercase tracking-widest whitespace-nowrap">Home</span>
                </a>

                <div class="glass p-4 rounded-xl flex items-center gap-4">
                    <img src="logo.png" alt="Lumin Logo" onerror="this.style.display='none'" class="h-10 w-auto">
                    <div>
                        <h1 class="serif text-2xl font-bold text-slate-900 header-title"></h1>
                    </div>
                </div>
            </div>
            
            <button onclick="resetCamera()" class="glass px-5 py-2.5 rounded-full text-[10px] font-bold uppercase tracking-widest text-slate-600 hover:text-slate-900 transition-colors">Reset View</button>
        </header>

        <footer class="flex justify-center">
            <div class="glass p-4 rounded-2xl max-w-sm text-center border-t-2 border-blue-500/20">
                <div class="flex items-center justify-center gap-2 mb-1">
                    <span class="counter-badge" id="current-index">Browsing Gallery</span>
                </div>
                <p class="text-xs text-slate-500">Select an image to enter full-view mode, then rotate to browse other images.</p>
            </div>
        </footer>
    </div>

    <div id="canvas-container" class="w-full h-screen"></div>

    <script>
        let scene, camera, renderer, controls, raycaster, mouse;
        let galleryGroup, particleSystem;
        let isFocused = false;
        const clock = new THREE.Clock();
        const galleryItems = [];

        // Image list - ensure these paths are correct relative to this file
        const images = [
            "pic1.jpeg",
            "pic2.jpeg",
            "pic3.jpeg",
            "pic4.jpeg",
            "pic5.jpeg",
            "pic6.jpeg"
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 35);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.6;
            controls.maxDistance = 50;
            controls.minDistance = 5;

            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            
            const keyLight = new THREE.DirectionalLight(0xffffff, 0.4);
            keyLight.position.set(10, 10, 10);
            scene.add(keyLight);

            createParticles();
            createGallery();

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });
            window.addEventListener('click', onSceneClick);
            window.addEventListener('resize', onResize);

            animate();
        }

        function createParticles() {
            const count = 1500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 100;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 100;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 100;

                colors[i * 3] = 0.15;
                colors[i * 3 + 1] = 0.45;
                colors[i * 3 + 2] = 0.95;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.3,
                blending: THREE.NormalBlending
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
        }

        function createGallery() {
            galleryGroup = new THREE.Group();
            const manager = new THREE.LoadingManager();
            const textureLoader = new THREE.TextureLoader(manager);
            
            manager.onProgress = (url, loaded, total) => {
                document.getElementById('progress').style.width = (loaded / total * 100) + '%';
            };
            manager.onLoad = () => {
                setTimeout(() => {
                    const loader = document.getElementById('loader');
                    if(loader) {
                        loader.style.opacity = '0';
                        setTimeout(() => loader.remove(), 500);
                    }
                }, 400);
            };

            const radius = 18;
            const pW = 14;
            const pH = 9;

            images.forEach((url, i) => {
                const angle = (i / images.length) * Math.PI * 2;
                
                const planeGeo = new THREE.PlaneGeometry(pW, pH);
                const texture = textureLoader.load(url, undefined, undefined, (err) => {
                    console.warn("Could not load image:", url);
                });
                texture.flipY = true;
                
                const planeMat = new THREE.MeshStandardMaterial({ 
                    map: texture,
                    side: THREE.FrontSide,
                    roughness: 0.1,
                    metalness: 0.05
                });

                const panel = new THREE.Mesh(planeGeo, planeMat);
                panel.position.set(
                    Math.cos(angle) * radius,
                    0, 
                    Math.sin(angle) * radius
                );

                panel.lookAt(0, 0, 0);
                panel.rotateY(Math.PI);

                panel.userData = { isArtwork: true, url: url, index: i + 1 };

                const frameGeo = new THREE.PlaneGeometry(pW + 0.6, pH + 0.6);
                const frameMat = new THREE.MeshStandardMaterial({ 
                    color: 0xffffff,
                    metalness: 0.1,
                    roughness: 0.5
                });
                const frame = new THREE.Mesh(frameGeo, frameMat);
                frame.position.z = -0.02;
                panel.add(frame);

                const shadowGeo = new THREE.PlaneGeometry(pW + 0.6, pH + 0.6);
                const shadowMat = new THREE.MeshBasicMaterial({
                    color: 0x000000,
                    transparent: true,
                    opacity: 0.04,
                    side: THREE.DoubleSide
                });
                const shadow = new THREE.Mesh(shadowGeo, shadowMat);
                shadow.position.z = -0.05;
                panel.add(shadow);

                galleryItems.push(panel);
                galleryGroup.add(panel);
            });

            scene.add(galleryGroup);
        }

        function onSceneClick(e) {
            if(isFocused) return;
            if (e.target.closest('#ui-layer') || e.target.closest('#focus-ui')) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(galleryItems, false);

            if (intersects.length > 0) {
                enterFocusMode(intersects[0].object);
            }
        }

        function enterFocusMode(target) {
            isFocused = true;
            controls.enabled = false;
            controls.autoRotate = false;

            document.getElementById('ui-layer').style.opacity = '0';
            document.getElementById('focus-ui').classList.add('visible');
            document.getElementById('current-index').innerText = `Piece ${target.userData.index} / ${images.length}`;

            const direction = new THREE.Vector3();
            target.getWorldDirection(direction);
            const dist = 11;
            const targetPos = target.position.clone().add(direction.multiplyScalar(dist));

            gsap.to(camera.position, {
                x: targetPos.x,
                y: targetPos.y,
                z: targetPos.z,
                duration: 1.5,
                ease: "expo.inOut"
            });

            gsap.to(controls.target, {
                x: target.position.x,
                y: target.position.y,
                z: target.position.z,
                duration: 1.5,
                ease: "expo.inOut",
                onUpdate: () => controls.update()
            });
        }

        function exitFocusMode() {
            isFocused = false;
            document.getElementById('ui-layer').style.opacity = '1';
            document.getElementById('focus-ui').classList.remove('visible');
            document.getElementById('current-index').innerText = "Browsing Gallery";

            gsap.to(camera.position, {
                x: 0,
                y: 5,
                z: 35,
                duration: 1.5,
                ease: "expo.inOut",
                onComplete: () => {
                    controls.enabled = true;
                    controls.autoRotate = true;
                }
            });

            gsap.to(controls.target, {
                x: 0,
                y: 0,
                z: 0,
                duration: 1.5,
                ease: "expo.inOut",
                onUpdate: () => controls.update()
            });
        }

        function resetCamera() {
            if(isFocused) exitFocusMode();
            else {
                gsap.to(camera.position, { x: 0, y: 5, z: 35, duration: 1.2, ease: "power2.inOut" });
                gsap.to(controls.target, { x: 0, y: 0, z: 0, duration: 1.2, ease: "power2.inOut" });
            }
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            if (controls.enabled) controls.update();

            if (particleSystem) {
                particleSystem.rotation.y = elapsed * 0.01;
            }

            if(!isFocused) {
                galleryItems.forEach((item, i) => {
                    item.position.y = Math.sin(elapsed * 0.5 + i) * 0.15;
                });

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(galleryItems, false);
                
                galleryItems.forEach(item => item.scale.lerp(new THREE.Vector3(1,1,1), 0.1));
                
                if (intersects.length > 0) {
                    intersects[0].object.scale.lerp(new THREE.Vector3(1.05, 1.05, 1.05), 0.1);
                    document.body.style.cursor = 'pointer';
                } else {
                    document.body.style.cursor = 'default';
                }
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
